name: Build ESP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c
        add-to-path: true

    - name: Build with NDK
      run: |
        # Проверяем, что Android.mk на месте
        if [ ! -f "jni/Android.mk" ]; then
          echo "ОШИБКА: jni/Android.mk не найден!"
          exit 1
        fi
        
        # Патчим entry.cpp для совместимости с инжектором (экспорт _)
        ENTRY_FILE="jni/src/entry.cpp"
        if [ -f "$ENTRY_FILE" ]; then
          echo 'extern "C" __attribute__((visibility("default"))) void _() {}' >> "$ENTRY_FILE"
          echo "Патч экспорта _ применен."
        fi

        # Запускаем сборку
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk APP_SUPPORT_FLEXIBLE_PAGE_SIZES=true -j4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp-lib
        path: "**/libs/arm64-v8a/*.so"
