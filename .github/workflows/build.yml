name: Build Cheat from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c
        add-to-path: true

    - name: Patch and Build
      run: |
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "ОШИБКА: zip не найден!"
          exit 1
        fi
        echo "Распаковываю $ZIP_FILE..."
        unzip -q "$ZIP_FILE"
        
        ENTRY_FILE=$(find . -name "entry.cpp" | head -n 1)
        if [ -n "$ENTRY_FILE" ]; then
          echo "" >> "$ENTRY_FILE"
          echo 'extern "C" __attribute__((visibility("default"))) void _() {}' >> "$ENTRY_FILE"
          echo "Патч применен."
        fi
        
        BUILD_SCRIPT=$(find . -name "build.sh" | head -n 1)
        if [ -z "$BUILD_SCRIPT" ]; then
          echo "ОШИБКА: build.sh не найден!"
          exit 1
        fi
        
        DIR=$(dirname "$BUILD_SCRIPT")
        cd "$DIR"
        
        chmod +x build.sh
        chmod +x scripts/build.sh || true
        
        export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
        ./build.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cheat-lib
        path: "**/out/arm64-v8a/*.so"
